<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Etrip 旅遊筆記</title>
  <meta name="description" content="行前做功課、旅途中隨心所欲：行程、口袋名單、附近推薦一次搞定">
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Etrip">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // 在畫面出現前套用外觀設定（深淺模式、主題色），避免閃一下
    try {
      var p = JSON.parse(localStorage.getItem("etrip_prefs") || "{}");
      if (p.theme === "light" || p.theme === "dark") document.documentElement.dataset.theme = p.theme;
      if (p.accent && p.accent !== "sky") document.documentElement.dataset.accent = p.accent;
    } catch (e) {}
  </script>
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="Etrip 首頁">
        <img src="icons/icon.svg" alt="" width="28" height="28">
        <span>Etrip</span>
      </a>
      <div id="tripHeader" class="trip-header"></div>
      <nav id="topNav" class="top-nav" aria-label="主要分頁"></nav>
    </div>
  </header>

  <main class="app-main">
    <div id="safetyBanner"></div>
    <section class="view" id="view-today" data-view="today" hidden></section>
    <section class="view" id="view-plan" data-view="plan" hidden></section>
    <section class="view" id="view-pocket" data-view="pocket" hidden></section>
    <section class="view" id="view-tools" data-view="tools" hidden></section>
  </main>

  <nav id="bottomNav" class="bottom-nav" aria-label="主要分頁"></nav>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
    <form id="sheetForm" method="dialog">
      <!-- 在輸入框按 Enter 時的預設按鈕 -->
      <button type="submit" value="__default" class="default-submit" tabindex="-1" aria-hidden="true"></button>
      <header class="sheet-head">
        <span class="sheet-grabber" aria-hidden="true"></span>
        <h3 id="sheetTitle"></h3>
        <button type="button" class="icon-btn" data-close aria-label="關閉">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </header>
      <div id="sheetBody" class="sheet-body"></div>
      <footer id="sheetFooter" class="sheet-foot"></footer>
    </form>
  </dialog>

  <!-- 第三方套件放在 vendor/，離線時也能使用 -->
  <script src="vendor/Sortable.min.js"></script>
  <script src="vendor/lz-string.min.js"></script>
  <script src="vendor/qrcode.js"></script>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/travel.js"></script>
  <script src="js/expenses.js"></script>
  <script src="js/packing.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/today.js"></script>
  <script src="js/pocket.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/trips.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/safety.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
